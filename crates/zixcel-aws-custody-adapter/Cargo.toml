[package]
exclude = ["/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "zixcel-aws-custody-adapter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Trusted in-process composition of Crowsi credential runtime and Zixcel AWS signing"
publish = false
repository = "https://github.com/zixcel/zixcel-aws"


[dependencies]
crowsi-credential-broker = { version = "=0.1.1" }
crowsi-credential-runtime = { version = "=0.1.0" }
zixcel-aws = { version = "=0.1.0", path = "../.." }
[dev-dependencies]
crowsi-local-control-bridge = { version = "=0.1.0" }
ed25519-dalek = "2.2.0"
hex = "0.4.3"
nix = { version = "0.31.3", features = ["user"] }
serde_json = "1.0.150"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "deny"
unwrap_used = "deny"
