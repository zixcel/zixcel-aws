[package]
exclude = ["*.tgz", "**/*.tgz", "/registration/**", "/state/**", "/.local/**", "/.state/**", "/.data/**", "/secrets/**", "/credentials/**", "/.env", "/.env.production", "/.env.local", "/*.tgz", "/*.tar.gz", "/*.tar", "/*.zip", "/*.whl", "/*.crate", "/.ruff_cache/**", "/.mypy_cache/**", "/.tox/**", "/.nox/**", "/.hypothesis/**", "/.coverage", "/.coverage.*", "/htmlcov/**", "/lcov.info", "/junit.xml", "/*.profraw", "/*.profdata", "/*.egg-info/**", "/target/**", "/node_modules/**", "/dist/**", "/build/**", "/.cache/**", "/.pytest_cache/**", "/coverage/**"]
name = "zixcel-aws"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
description = "Credential-reference and SigV4 boundary for independent AWS integrations"
license = "Apache-2.0"
readme = "README.md"
publish = false

[package.metadata.zixcel]
boundary = "credential-use-and-signing"
external_actions = false
network_client = false
credential_values_in_wire = false

[workspace]
members = ["."]
resolver = "3"

[dependencies]
hmac = "0.12.1"
nix = { version = "0.29.0", features = ["socket", "user"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing"] }
zeroize = { version = "=1.8.2", features = ["serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
